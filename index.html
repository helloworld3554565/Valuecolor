<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00008b">
  <title>معرفة قيمة اللون</title>
  <style>
   body {
     background-image:url('f7e.jpg') ;
     background-size:100vw 100vh; 
     color: white;
     display:flex; 
     flex-flow:column; 
     align-items: center;
  justify-content: center;
   }
   h1{
     color: white;
     text-align:center; 
     font-size:50px; 
    
   }
   input {
     width: 200px;
     height:150px; 
   }
   
  </style>
  <body>
    <h2>اضغط على مربع الوان للحصول على قيمة اللون</h2>
    <input type="color">
    <h1></h1>
  <script>
    h1qs=document.querySelector("h1")
    input=document.querySelector("input")
  input.addEventListener('input',async ()=>{
    h1qs.innerHTML=` اللون هو:${input.value}`  
  await navigator.clipboard.writeText(input.value)
  })
  
  </script>
    
    
  </body>
